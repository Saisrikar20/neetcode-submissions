name: Update Problem Counter & README

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'SOLUTIONS.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run README Auto-Updater
        run: python scripts/update_readme.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SOLUTIONS.md
          if git diff --staged --quiet; then
            echo "No changes detected in README.md or SOLUTIONS.md"
          else
            git commit -m "ci(readme): update solved count and problem catalog [skip ci]"
            git push
          fi
